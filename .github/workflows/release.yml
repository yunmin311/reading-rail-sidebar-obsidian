name: Release plugin

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # tag 必须与 manifest.json 里的 version 完全一致 —— 这是 Obsidian
      # 社区市场安装插件的唯一依据：它拿 manifest 的 version 去找同名 Release。
      # 写成 v1.0.0 或 1.0.0-beta 都会让市场找不到，所以这里硬校验、对不上直接失败。
      - name: Version must match tag
        run: |
          version=$(node -p "require('./manifest.json').version")
          tag="${GITHUB_REF_NAME}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag '$tag' 与 manifest.json 的 version '$version' 不一致"
            echo "修正方式：要么改 manifest 版本号，要么删掉这个 tag 重打。"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
        id: check

      # 资产清单 = manifest + 仓库根下所有 .js + styles.css。
      #
      # 这里刻意用通配扫描而不是写死文件名：插件用 require("./x") 加载同目录
      # 的伴随模块（i18n.js / locales.js / sponsor.js …），少传一个，
      # 用户从 Release 装上就是 MODULE_NOT_FOUND，而且是打开设置页才炸。
      # 写死清单时踩过这个坑 —— 加了 i18n.js 却忘了改工作流。
      #
      # .js 通配会连 main.js 一起带上，所以不再单独列它。
      # styles.css 只在存在时传（没有它不是错误）。
      - name: Collect assets
        id: assets
        run: |
          files="manifest.json"
          for f in *.js; do [ -f "$f" ] && files="$files $f"; done
          [ -f styles.css ] && files="$files styles.css"
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "将上传：$files"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            ${{ steps.assets.outputs.files }}
